<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#082f74">
  <title>MCI · 管理后台登录</title>
  <link rel="icon" type="image/png" href="../assets/mci-favicon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#eef8fd,#f8fbfd);font:15px/1.5 Arial,sans-serif;color:#142b51}.login{width:min(420px,100%);background:#fff;border:1px solid #dceaf3;border-radius:24px;padding:32px;box-shadow:0 18px 55px #184b7020}.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}.brand img{width:48px;height:48px;object-fit:contain}.brand b{display:block;font-size:19px;color:#082f74}.brand span{color:#71839a;font-size:13px}.field{margin-top:15px}.field label{display:block;font-size:13px;font-weight:800;color:#5f7390;margin-bottom:6px}.field input{width:100%;border:1px solid #caddea;border-radius:12px;padding:12px 13px;font:inherit;outline:none}.field input:focus{border-color:#1874c1;box-shadow:0 0 0 3px #1874c11a}.submit{width:100%;border:0;border-radius:12px;background:#082f74;color:#fff;padding:13px;margin-top:22px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.6}.error{min-height:22px;margin:11px 0 0;color:#b4232c;font-size:13px;text-align:center}.back{display:block;text-align:center;color:#1874c1;text-decoration:none;font-size:13px;margin-top:14px}
  </style>
</head>
<body>
  <main class="login"><div class="brand"><img src="../assets/mci-favicon.png" alt="MCI"><div><b>会务内容后台</b><span>管理员安全登录</span></div></div><form id="loginForm"><div class="field"><label for="username">管理员账号</label><input id="username" type="email" autocomplete="username" required></div><div class="field"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="submit" id="submitBtn" type="submit">登录</button><p class="error" id="error" role="alert"></p></form><a class="back" href="/info/">返回参会者端</a></main>
  <script>
    loginForm.onsubmit=async e=>{e.preventDefault();error.textContent='';submitBtn.disabled=true;submitBtn.textContent='正在登录…';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'登录失败');const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/info/admin')?next:'/info/admin/'}catch(err){error.textContent=err.message}finally{submitBtn.disabled=false;submitBtn.textContent='登录'}};
  </script>
</body>
</html>
